<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1 id="titulo">Titulo Original</h1>

    <p id="texto">CONTENIDO DEL PÁRRAFO</p>

    <button onclick="cambiarTexto()">Cambiar Texto</button>
    <button onclick="cambiarEstilo()">Cambiar estilo CSS</button>


 <script>
        function cambiarTexto() {
            // Muestra cuadro emergente
        document.getElementById('titulo').innerHTML =  'TITULO MODIFICADO'  
                document.getElementById('texto').innerHTML =  'El contenido del párrafo ha sido actualizado'
     }

        function cambiarEstilo() {
            var x = document.getElementById("texto");
            x.style.fontSize = "25px";
            x.style.color = "red";
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Boletín de notas de clase</title>
</head>
<body>
    <h1>Boletín de notas de clase</h1>

    <table border="3" id="tabla">
        <tr>
            <th>Alumno</th>
            <th>1T</th>
            <th>2T</th>
            <th>3T</th>
            <th>Media</th>
            <th>Calificación</th>
        </tr>

        <tr>
            <td>Ana</td>
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td>Luis</td>
            <td>4</td>
            <td>5</td>
            <td>6</td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td>Mara</td>
            <td>3</td>
            <td>4</td>
            <td>2</td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td>Pablo</td>
            <td>9</td>
            <td>10</td>
            <td>9</td>
            <td></td>
            <td></td>
        </tr>
    </table>

    <h2>Añadir alumno</h2>
    Nombre: <input type="text" id="nombre"><br><br>
    1T: <input type="number" id="nota1" min="0" max="10" ><br><br>
    2T: <input type="number" id="nota2" min="0" max="10" ><br><br>
    3T: <input type="number" id="nota3" min="0" max="10" ><br><br>
    <button onclick="anadirAlumno()">Añadir</button>


    <h2>CONSULTAS</h2>
 
    <div class="fila">
      <button id="btnAprobados" onclick="contarAprobados()">CONTAR APROBADOS</button>
      <button id="btnMejor" onclick="mejorNota()">MEJOR NOTA DE LA CLASE</button>
      <button id="btnMediaTrimestre" onclick="mediaTrimestre()">Media de un trimestre</button>
      <select id="selTrimestre">
        <option value="0">1ºT</option>
        <option value="1" selected>2ºT</option>
        <option value="2">3ºT</option>
      </select>
    </div>
 
    <div class="fila">
      <input type="text" id="inputAlumno" placeholder="Introduce el nombre del alumno">
      <button id="btnBuscar" onclick="buscarAlumno()">BUSCAR</button>
    </div>
 
    <h3>Resultado</h3>
    <pre id="resultado"></pre>
 


    <script>
        function color(nota) {
            if (nota >= 5) {
                return "green";
            } else {
                return "red";
            }
        }

        function calificacion(nota) {
            if (nota >= 9) {
                return "Sobresaliente";
            } else if (nota >= 7) {
                return "Notable";
            } else if (nota >= 6) {
                return "Bien";
            } else if (nota >= 5) {
                return "suficiente";
            } else {
                return "insuficiente";
            }
        }

        function rellenarFila(fila) {
            var celdas = fila.cells;

            var nota1 = Number(celdas[1].innerText);
            var nota2 = Number(celdas[2].innerText);
            var nota3 = Number(celdas[3].innerText);

            var media = (nota1 + nota2 + nota3) / 3;

            celdas[1].style.background = color(nota1);
            celdas[2].style.background = color(nota2);
            celdas[3].style.background = color(nota3);

            celdas[4].innerText = media.toFixed(1);
            celdas[4].style.background = color(media);
            celdas[5].innerText = calificacion(media);
        }

        var tabla = document.getElementById("tabla");

        for (var i = 1; i < tabla.rows.length; i++) {
            rellenarFila(tabla.rows[i]);
        }

        function anadirAlumno() {
            var nombre = document.getElementById("nombre").value;
            var nota1 = document.getElementById("nota1").value;
            var nota2 = document.getElementById("nota2").value;
            var nota3 = document.getElementById("nota3").value;

            if (nombre == "" || nota1 == "" || nota2 == "" || nota3 == "") {
                window.alert("Rellena el nombre y las tres notas");
                return;
            }

            var fila = tabla.insertRow();

            fila.insertCell().innerText = nombre;
            fila.insertCell().innerText = nota1;
            fila.insertCell().innerText = nota2;
            fila.insertCell().innerText = nota3;
            fila.insertCell();
            fila.insertCell();

            rellenarFila(fila);

            document.getElementById("nombre").value = "";
            document.getElementById("nota1").value = "";
            document.getElementById("nota2").value = "";
            document.getElementById("nota3").value = "";
        }


        function contarAprobados(){
            var contadorAprobados = 0;
           for (var i = 1; i < tabla.rows.length; i++) {
                var fila = tabla.rows[i];
                
                var notaMedia = Number(fila.cells[4].innerText);

                
                if (notaMedia >= 5) {
                    contadorAprobados++;
                }
            }
    
                document.getElementById("resultado").innerText = "Número de aprobados: " + contadorAprobados;
         }



         function mejorNota() {
            var mejorNota = 0;
            var mejorAlumno = "";

            for (var i = 1; i < tabla.rows.length; i++) {
                var fila = tabla.rows[i];
                var nota1 = Number(fila.cells[1].innerText);
                var nota2 = Number(fila.cells[2].innerText);
                var nota3 = Number(fila.cells[3].innerText);

                if (nota1 > mejorNota) {
                    mejorNota = nota1;
                    mejorAlumno = fila.cells[0].innerText;
                }

                if (nota2 > mejorNota) {
                    mejorNota = nota2;
                    mejorAlumno = fila.cells[0].innerText;
                }

                if (nota3 > mejorNota) {
                    mejorNota = nota3;
                    mejorAlumno = fila.cells[0].innerText;
                }
            }

            document.getElementById("resultado").innerText = "Mejor nota: " + mejorNota + " del alumno: " + mejorAlumno;
   
        }      
    
       function mediaTrimestre() {
            var trimestre = Number(document.getElementById("selTrimestre").value);
            var sumaNotas = 0;
            var numAlumnos = tabla.rows.length - 1;

        for (var i = 1; i < tabla.rows.length; i++) {
            var fila = tabla.rows[i];
            var nota = Number(fila.cells[trimestre + 1].innerText);
            sumaNotas += nota;
        }

        var media = sumaNotas / numAlumnos;

        document.getElementById("resultado").innerText = "Media del trimestre " + (trimestre + 1) + ": " + media.toFixed(2);
    }
    
    function buscarAlumno() {
        var nombreBuscado = document.getElementById("inputAlumno").value.toLowerCase();
        var encontrado = false;

        for (var i = 1; i < tabla.rows.length; i++) {
            var fila = tabla.rows[i];
            var nombreAlumno = fila.cells[0].innerText.toLowerCase();

            if (nombreAlumno == nombreBuscado) {
                var nota1 = Number(fila.cells[1].innerText);
                var nota2 = Number(fila.cells[2].innerText);
                var nota3 = Number(fila.cells[3].innerText);
                var media = Number(fila.cells[4].innerText);
                var calificacionFinal = fila.cells[5].innerText;

                document.getElementById("resultado").innerText =
                    " Alumno: " + fila.cells[0].innerText + 
                    " 1T: " + nota1 + 
                    " 2T: " + nota2 +
                    " 3T: " + nota3 + 
                    " Media : " + media.toFixed(1) + 
                    " Calificación: " + calificacionFinal;

                encontrado = true;
                break;
            }
        }

        if (!encontrado) {
            document.getElementById("resultado").innerText = "Alumno no encontrado.";
        }
    }
    
    </script>
    <style>
        body {
            background-color: aliceblue;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        h1 {
            text-align: center;
        }

        h2 {
            text-align: center;
        }



    </style>
</body>
</html>

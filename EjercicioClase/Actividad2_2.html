<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actividad 2.2</title>
  <script>
    function Persona(nombre, edad, altura) {
      this.nombre = nombre;
      this.edad = edad;
      this.altura = altura;
    }

    var persona1 = new Persona("Dimas", 28, 185);

    console.log("El usuario " + persona1.nombre +
                " tiene " + persona1.edad +
                " años y mide " + persona1.altura + " centímetros.");
  </script>
</head>
<body>
  <h1>Actividad 2.2</h1>
  <p>Abre la consola del navegador (F12) para ver el mensaje.</p>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
  <h1>Tema que se recuerda</h1>

  <button onclick="cambiarTema()">Cambiar tema</button>
  <p id="texto"></p>

  <script>
    function mostrar(tema) {
      document.getElementById("texto").textContent = "Tema: " + tema;
      if (tema === "oscuro") {
        document.body.style.background = "black";
        document.body.style.color = "white";
      } else {
        document.body.style.background = "white";
        document.body.style.color = "black";
      }
    }

    function cambiarTema() {
      let tema = localStorage.getItem("tema");

      if (tema === null) {
        tema = "claro";
      }

      if (tema === "claro") {
        tema = "oscuro";
      } else {
        tema = "claro";
      }

      localStorage.setItem("tema", tema);
      mostrar(tema);
    }

    let guardado = localStorage.getItem("tema");
    if (guardado === null) {
      guardado = "claro";
    }
    mostrar(guardado);
  </script>
</body>
</html>
